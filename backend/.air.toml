root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ."
  # `bin`, not `entrypoint`. Air has no `entrypoint` key, so the old line was
  # discarded by the TOML decoder and the container only worked because Air's
  # default bin happens to be ./tmp/main, which is what cmd above builds.
  # Pointing it anywhere else would have had no effect and no error.
  bin = "./tmp/main"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "node_modules", "static", "frontend"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = true
  follow_symlink = false
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = 500
  log = "build-errors.log"
  poll = true
  poll_interval = 500
  rerun = true
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = true
  main_only = false

[misc]
  clean_on_exit = true
